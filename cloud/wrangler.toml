TEMPERATURE = "0.75"
SHELL_CHANCE = "0.10"
# Which séance stages get a reasoning scratchpad. Measured, not guessed — see the
# header of src/llm.js. Empty string = never think; "weave,refine,echoes,seal,tale" = always.
THINK_STAGES = "weave,tale,ask"
T_SHORT = "20"

# The cloud turtle — turtle-oracle.unforced.dev
#
# Deploy staging (workers.dev only, no custom domain):
#   npm run deploy:staging
# Production is the worker named `turtle-oracle`, which owns the custom domain and is
# deployed by hand after review:
#   npm run deploy
#
# Auth comes from the environment, never from this file:
#   export CLOUDFLARE_API_TOKEN=...   export CLOUDFLARE_ACCOUNT_ID=...

name = "turtle-oracle"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = false

# Card art is not duplicated into the repo: prepare-assets.sh copies cards/web/* into
# assets/ before every build, and assets/{med,thumb,tiles,avatar.jpg} are gitignored.
[build]
command = "bash prepare-assets.sh"

[assets]
directory = "assets"
binding = "ASSETS"
# a missing /tiles/*.jpg must 404 so the kiosk's onerror handler hides the tile,
# rather than being handed index.html and rendering it as a broken image
not_found_handling = "none"
# without this, asset requests are answered at the edge without running the Worker,
# and serveAsset's CSP/nosniff headers never reach the kiosk
run_worker_first = true

[ai]
binding = "AI"

# Séance state: one Durable Object per séance, addressed by the séance id. KV cannot hold
# this — it caches a read at the location that served it for ~60s and a write does not
# invalidate that cache, so two turns seconds apart could roll the state machine backwards.
# See src/sessiondo.js. SQLite storage because it is the only DO storage on the free plan.
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

# The Tale-Book and the tiers counter, which are best-effort counters read minutes or days
# after they are written and are happy being eventually consistent: lore:name:* for 30
# days, lore:counts and tiers forever.
[[kv_namespaces]]
binding = "SESSIONS"
id = "37010e57750c4c989c563ff76e829c0e"

# 30 POST /api/* calls a minute per IP — a minimal séance is about seven, so this is a
# roof over a scraper, not over a seeker. src/index.js treats a missing RL binding as
# "no limit", so deleting this block degrades to the pre-limit behaviour rather than
# breaking the Worker.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# The voice, on its own budget. /api/speak is one POST per SENTENCE — a séance with the
# Turtle's voice on is ~41 of them — so on the shared 30/min counter two phones behind one
# carrier NAT could 429 each other out of a reading. Same "missing binding = no limit"
# rule; only /api/speak spends from this one.
[[unsafe.bindings]]
name = "RL_SPEAK"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# The ears, on their own budget too. One POST to /api/transcribe is up to two minutes of
# audio billed by Workers AI, so on the shared 30/min counter a single IP could push
# ~120MB of whisper a minute — and every one of those POSTs also came out of a real
# seeker's séance budget. src/ears.js additionally requires a live séance in a listening
# stage, so this is the roof over a seeker who taps the mic a lot, not the gate.
[[unsafe.bindings]]
name = "RL_EARS"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 12, period = 60 }

[vars]
# Same family as the playa Spark's qwen3:30b-a3b. Verified on this account 2026-08-23.
MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
# Tried once if the primary errors or hangs. Verified, ~480ms, no scratchpad at all.
MODEL_FALLBACK = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MAX_TOKENS = "4096"
TEMPERATURE = "0.75"
# One séance in ten lets a Shell card — the Tree's own spine — into a Tree slot.
SHELL_CHANCE = "0.10"
# Which séance stages get a reasoning scratchpad. Measured, not guessed — see the
# header of src/llm.js. Empty string = never think; "weave,refine,echoes,seal,tale" = always.
# `ask` thinks too (added 2026-09-02): without the scratchpad the look at the table came
# back as three six-word captions ("Titanic says… Pulse says… Crown says…"), none of them
# in the seeker's words. The draw already runs under the veil, so the seconds are covered.
THINK_STAGES = "weave,tale,ask"
# Patience before dropping to the offline template. The playa numbers (45/60) were set
# against a single serialised GPU; Workers AI answers a séance stage in 0.4-6s, so these
# are guards against a genuinely hung model, not pacing controls. The draw runs two
# stages in one request, side by side since 2026-09-02, and each may also spend half as
# long again on the fallback model; the weave may roll a second time, but only while half
# its budget is unspent and with half the timeout. Worst case is max(1.5 * 38,
# 1.5 * 20) = 57s, or 19 + 1.5 * 19 = 48s on the two-roll path, against a ~100s edge
# timeout (it was 1.5 * (38 + 20) = 87s when the two stages ran one after the other).
T_SHORT = "20"
T_LONG = "38"
WHISPER_MODEL = "@cf/openai/whisper-large-v3-turbo"
# Set TTS_MODEL = "off" to fall the kiosk back to the tablet's own browser voice.
TTS_MODEL = "@cf/deepgram/aura-1"
TTS_SPEAKER = "angus"

[observability]
enabled = true

# --- staging: same code, workers.dev URL, no custom domain --------------------------
[env.staging]
name = "turtle-oracle-staging"
workers_dev = true

[env.staging.build]
command = "bash prepare-assets.sh"

[env.staging.assets]
